<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lion</title>
    <style>
        body {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        video,
        img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        section {
            margin-bottom: 30px;
        }

        audio {
            display: block;
            width: 100%;
        }

        #photo {
            background-color: #fff3e0;
        }

        #about {
            color: darkblue;
        }

        #video {
            background-color: #e8f5e9;
        }

        #audio {
            background-color: #f3e0ff;
        }
    </style>
</head>

<body>
    <h1>lion</h1>
    <section id="photo">
        <h2>Photo</h2>
        <img src="images/lion.jpg" alt="lion" width="400">
    </section>
    <section id="about">
        <h2>About the Lion</h2>
        <p>The lion is a large wild cat known as the "king of the jungle." </p>
        <p>Lions live in groups called prides. </p>
        <p>They live in Africa and eat meat. </p>
    </section>
    <section id="video">
        <h2>Video</h2>
        <video src="videos/lion.mp4" controls width="400"></video>
    </section>
    <section id="audio">
        <h2>Audio</h2>
        <audio src="audios/lion.mp3" controls></audio>
    </section>
</body>

</html>
