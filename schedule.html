<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Schedule</title>
</head>

<body>
    <table border="1">
        <thead>
            <tr>
                <th>Day</th>
                <th>Subject</th>
                <th>Time</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Sunday</td>
                <td rowspan="2">Math</td>
                <td>9:00 AM - 10:00 AM</td>
            </tr>
            <tr>
                <td>Monday</td>
                <td>10:00 AM - 11:00 AM</td>
            </tr>
            <tr>
                <td>Tuesday</td>
                <td>Science</td>
                <td rowspan="2">11:00 AM - 12:00 PM</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td>History</td>
            </tr>
            <tr>
                <td>Thursday</td>
                <td>English</td>
                <td>12:00 PM - 1:00 PM</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
