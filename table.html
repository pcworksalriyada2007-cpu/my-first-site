<!DOCTYPE html>
<html lang="en">

<head>
    <title>Tables</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 id="page-title">My Tables</h1>
    <p class="note" id="special">there are my practice tables</p>
    <p class="note">I made in week 1</p>

    <table border="1">
        <thead>
            <tr>
                <th>name</th>
                <th>age</th>
                <th>city</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>worker</td>
                <td>19</td>
                <td>Ibra</td>
            </tr>
        </tbody>
    </table>
    <br>
    <table border="1">
        <thead>

            <tr>
                <th colspan="2">weekly</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Sunday</td>
                <td>HTML</td>
            </tr>
        </tbody>
    </table>
    <br>
    <table border="1">
        <tbody>

            <tr>
                <td rowspan="2">Sunday</td>
                <td>HTML</td>
            </tr>
            <tr>
                <td>CSS</td>
            </tr>
        </tbody>
    </table>
    <br>
    <table border="1">
        <thead>
            <tr>
                <th colspan="3">Name</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>John Doe</td>

</html>
